# Termux settings for running gh (and tmux) on a phone.
#
# Install by copying to ~/.termux/termux.properties, then run:
#     termux-reload-settings
#
# Termux loads this file with java.util.Properties, so it is neither json nor
# shell: one key=value per line, '#' starts a comment, and a key may appear
# only once. The extra-keys value below is a single JSON array holding all three
# rows. Splitting it into several extra-keys lines would silently keep only the
# last one.
#
# Each key in that array is either a string ("ESC") or an object allowing key,
# macro, display and popup. Popups fire on swipe-up. The extra keys row is shown
# by long-pressing the keyboard button in the left drawer.
#
# Validate this file after editing it:
#     test/run-tests.sh

# Row 1: modifiers and the keys gh's own prompts need.
#
# gh's interactive prompts (pr create, pr checkout, issue create) are arrow-key
# driven and are cancelled with Ctrl-C or Escape, so both must be reachable
# without a hardware keyboard. CTRL and ALT are sticky modifiers: tap one, then
# tap a letter, and you get that combination.
#
#   swipe up on BKSP: DEL (forward delete), since Android's backspace is
#                     line-oriented on most IMEs and never deletes forward
#   swipe up on the arrows: HOME, PGDN, PGUP, END
#
# Row 2: shell characters gh commands and its pager need often.
#
# `|` appears in every `gh api --jq` and `gh pr list | grep`, `~` in every
# `gh browse -- '~/path'`, and `-` starts nearly every gh flag. Without a pipe
# key on a phone, `gh api ... | jq` is impossible.
#
#   swipe up on ": backslash, for `gh api -f 'body=hello\nworld'`
#   swipe up on ': backtick, for quoting inside gh --jq strings
#   swipe up on +: equals
#
# The backslash is written as Termux's BACKSLASH alias rather than as a
# character. java.util.Properties unescapes backslashes before org.json ever
# sees the value, so a literal '\\' in this file arrives at the JSON parser
# already mangled and the whole extra-keys row silently falls back to the
# default. BACKSLASH is one of ExtraKeysConstants.CONTROL_CHARS_ALIASES, which
# Termux passes to ExtraKeysInfo, so it resolves to a real backslash key.
#
# The '-' key sets display explicitly. With extra-keys-style = all, Termux would
# otherwise label it with U+2015 HORIZONTAL BAR, which looks like a hyphen and
# is not one.
#
# Row 3: one-tap tmux control sequences.
#
# Each entry is a {macro: ...} that Termux expands into the exact keys tmux
# expects. Two things to know about how Termux expands these, both verified in
# termux-app's TerminalExtraKeys.onExtraKeyButtonClick:
#
#   * a macro is split on spaces, and a modifier applies only to the single key
#     after it. So 'CTRL b d' is Ctrl-B, then a plain 'd' -- exactly right for
#     a tmux prefix key, where the prefix and the command are separate keys.
#   * modifier keys are matched by name and are not themselves sent.
#
# The prefix is Ctrl-B by default. If you change it with
# `tmux set -g prefix C-a`, update every macro below to match.
#
# Commands and the tmux 3.7c default each one runs:
#
#   tMX  d   detach-client       leaves gh running in the background
#   tMs  %   split-window -h     two panes side by side
#   tMw  "   split-window        gh output above a shell
#   tMk  &   kill-window (asks) closes this gh session when it is the last
#   tMW  c   new-window          a second gh command in the same session
#   tMn  n   next-window
#   tMp  p   previous-window
#   tMz  z   resize-pane -Z      zoom the pane full screen and back
#   tM[  [   copy-mode           scroll back through gh output
#   tMq  q   display-panes       show every pane at once, to pick one
#   tM?  ?   list-keys -N        tmux's own shortcut list
#   tMt  t   clock-mode          the clock tmux already knows how to show
#
# Popups give the alternates, so nothing needs more than a swipe away.
extra-keys = [['ESC','CTRL','ALT','TAB',{key:'BKSP',popup:'DEL'},'ENTER',{key:'LEFT',popup:'HOME'},{key:'DOWN',popup:'PGDN'},{key:'UP',popup:'PGUP'},{key:'RIGHT',popup:'END'}],['|','~',{key:'-',display:'-'},'/',{key:'"',popup:'BACKSLASH'},{key:"'",popup:'`'},'$','*',{key:'+',popup:'='}],[{macro:'CTRL b d',display:'tMX',popup:{macro:'CTRL b &',display:'kill win'}},{macro:'CTRL b %',display:'tMs',popup:{macro:'CTRL b "',display:'v-split'}},{macro:'CTRL b c',display:'tMW',popup:{macro:'CTRL b n',display:'next win'}},{macro:'CTRL b p',display:'tMp',popup:{macro:'CTRL b z',display:'zoom'}},{macro:'CTRL b [',display:'tM[',popup:{macro:'CTRL b q',display:'panes'}},{macro:'CTRL b ?',display:'tM?',popup:{macro:'CTRL b t',display:'clock'}}]]

# The back key sends Escape, which is what cancels a gh prompt. The default,
# "back", closes the keyboard and then leaves the app, so a mis-tap inside a gh
# prompt loses your place.
back-key = escape

# Leave room at the edges so the extra keys and the leftmost prompt buttons stay
# reachable with gesture navigation enabled. Termux's default is 3.
terminal-margin-horizontal = 4

# Termux's default is already 2000 rows, so this only matters if you have
# lowered it. The allowed range is 100 to 50000; gh pagers and long
# `gh pr view` output are unreadable without it, and tmux keeps further history
# on top of this buffer anyway.
terminal-transcript-rows = 10000

# Keys are small on a phone, so a slightly larger row helps.
extra-keys-style = all
