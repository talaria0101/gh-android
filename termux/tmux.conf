# tmux settings for running gh on a phone, for Termux.
#
# Install by copying to ~/.tmux.conf, then apply it to the running server:
#     tmux source-file ~/.tmux.conf
#
# tmux reads this file only when its *server* starts, so a server already
# running keeps its old settings. `ghm kill` is not a way to reload it: that
# ends one session, and exit-empty below keeps the server alive.
#
# The prefix stays Ctrl-B. The keys that matter are on the third row of the
# extra keys in termux/termux.properties, where each is a single tap.

# --- history ---------------------------------------------------------------
#
# gh pagers, `gh run watch` scrolling and long `gh pr view` output are all
# unreadable without scrollback, and the default 2000 lines is not much once
# several gh commands have run in the same session. Android caps what a phone
# can usefully show, but memory is the cheaper resource here.
set -g history-limit 50000

# Keep a pane's contents around after the command in it exits. Without this,
# a `gh pr list` that finished scrolling past its output loses it the moment
# the pane is gone, and on a phone re-running it is expensive.
set -g remain-on-exit on

# --- status bar ------------------------------------------------------------
#
# Short status line: on a narrow screen the default eats two or three rows of
# terminal, which is a large part of the screen.
set -g status on
set -g status-interval 5
set -g status-style "bg=colour236,fg=colour250"
set -g status-left-length 30
set -g status-left " #[bold]#S#[default] "
set -g status-right " %H:%M "

# Do not let the status bar swallow taps meant for the shell.
set -g status-position bottom

# --- copy mode and scrolling ------------------------------------------------

# A phone has no middle-click paste and no wheel to hand. This makes the
# keyboard-only paths obvious: q exits copy mode, which is already tmux's
# default in the vi table, and the arrow keys plus PgUp/PgDn (which the extra
# keys row provides) scroll.
#
# Only copy-mode-vi is bound below. tmux selects that table because mode-keys is
# vi, so bindings in copy-mode would never be consulted.
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "tmux save-buffer -"
bind -T copy-mode-vi Escape send -X cancel

# Scrolling the wheel in copy mode should move a screen, not one line.
bind -T copy-mode-vi WheelUpPane send -X -N 5 scroll-up
bind -T copy-mode-vi WheelDownPane send -X -N 5 scroll-down

# --- gh-friendly splits ----------------------------------------------------

# New panes split the *current* directory, so a second gh command in a split
# starts in the same repo. Without this tmux uses the server's default path.
bind c new-window -c "#{pane_current_path}"

# Number keys select windows by index, which is quicker on a phone than
# prefix+next repeatedly.
bind -T prefix 1 select-window -t :1
bind -T prefix 2 select-window -t :2
bind -T prefix 3 select-window -t :3
bind -T prefix 4 select-window -t :4
bind -T prefix 5 select-window -t :5

# --- mobile hardware notes -------------------------------------------------
#
# A hardware or Bluetooth keyboard on Android sends a real Ctrl-B, so the
# default prefix works as is, and the default prefix bindings are left alone.
# In particular prefix Space is already next-layout in tmux's own table, so
# there is nothing to add here.
#
# One key worth knowing about: Ctrl-C is not bound to anything in tmux, so it
# reaches the program in the pane. That is what cancels a gh prompt, and it is
# easy to lose track of on a keyboard where every modifier looks the same.

# --- session behaviour -----------------------------------------------------
#
# Both of these keep a session alive after its last window closes, which is what
# ghm relies on: `ghm` finds sessions by name, and a session that vanished the
# moment a command finished would make `ghm attach` and `ghm ls` unreliable.
#
# The trade is that an empty session lingers. `ghm kill` is how to clear it.
set -g destroy-unattached off
set -g exit-empty off
